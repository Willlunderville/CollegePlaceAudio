name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cpanel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload static site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SFTP client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Upload files to cPanel
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.CPANEL_SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.CPANEL_SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          SSH_REMOTE_DIR: ${{ secrets.CPANEL_SSH_REMOTE_DIR }}
        run: |
          set -euo pipefail

          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USERNAME" ] || [ -z "$SSH_PASSWORD" ] || [ -z "$SSH_PORT" ] || [ -z "$SSH_REMOTE_DIR" ]; then
            echo "Missing one or more required cPanel SSH/SFTP secrets."
            exit 1
          fi

          sshpass -p "$SSH_PASSWORD" sftp \
            -o StrictHostKeyChecking=accept-new \
            -P "$SSH_PORT" \
            "$SSH_USERNAME@$SSH_HOST" <<EOF
          -mkdir "$SSH_REMOTE_DIR"
          -mkdir "$SSH_REMOTE_DIR/assets"
          put index.html "$SSH_REMOTE_DIR/index.html"
          put styles.css "$SSH_REMOTE_DIR/styles.css"
          put script.js "$SSH_REMOTE_DIR/script.js"
          put assets/college-place-exterior.png "$SSH_REMOTE_DIR/assets/college-place-exterior.png"
          put assets/college-place-logo.jpeg "$SSH_REMOTE_DIR/assets/college-place-logo.jpeg"
          put assets/the-big-squeeze.jpg "$SSH_REMOTE_DIR/assets/the-big-squeeze.jpg"
          put assets/tiny-pretty-things.jpg "$SSH_REMOTE_DIR/assets/tiny-pretty-things.jpg"
          put assets/favicon.png "$SSH_REMOTE_DIR/assets/favicon.png"
          put assets/favicon-32.png "$SSH_REMOTE_DIR/assets/favicon-32.png"
          put assets/apple-touch-icon.png "$SSH_REMOTE_DIR/assets/apple-touch-icon.png"
          bye
          EOF
